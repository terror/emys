[package]
name = "emys"
version = "0.1.0"
edition = "2024"
description = "Back up and search shell history with SQLite"

[lints.rust]
unreachable_pub = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
arbitrary-source-item-ordering = "deny"
wildcard_imports = "allow"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive"] }
rusqlite = { version = "0.40.1", features = ["backup", "bundled"] }
uuid = { version = "1.24.0", features = ["v4"] }
xdg = "3.0.0"

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(unix)".dependencies]
skim = { version = "5.6.1", default-features = false, features = ["cli"] }
