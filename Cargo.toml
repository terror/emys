[package]
name = "honu"
version = "0.1.0"
edition = "2024"
description = "Back up and search shell history with SQLite"
autotests = false

[workspace]
members = [".", "crates/*"]

[workspace.lints.rust]
unreachable_pub = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
arbitrary-source-item-ordering = "deny"
wildcard_imports = "allow"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive"] }
imara-diff = { version = "0.2.0", default-features = false }
indicatif = "0.18.6"
ratatui = "0.30.0"
rusqlite = { version = "0.40.1", features = ["backup", "bundled"] }
skim = { version = "5.6.1", default-features = false, features = ["cli"] }
tempfile = "3.27.0"
unicode-display-width = "0.3.0"
unicode-segmentation = "1.12.0"
uuid = { version = "1.24.0", features = ["v4"] }
xdg = "3.0.0"

[dev-dependencies]
indoc = "2.0.7"
pretty_assertions = "1.4.1"

[[test]]
name = "integration"
path = "tests/lib.rs"

[target."cfg(unix)".dev-dependencies]
expectrl = "0.9.0"
